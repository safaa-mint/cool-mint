<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COOL MINT 🍃🍵</title>
  <style>
    /* خلفية الغابة العميقة */
    body {
      background: #0f2310;
      background-image: 
        radial-gradient(circle at 50% 50%, #1e4620 0%, #0f2310 80%);
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
      overflow-x: hidden;
    }

    /* أشجار في زوايا الشاشة البعيدة */
    .forest-corner {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0.35;
      font-size: 90px;
      user-select: none;
    }
    .top-left { top: -20px; left: -10px; }
    .top-right { top: -20px; right: -10px; }
    .bottom-left { bottom: -20px; left: -10px; }
    .bottom-right { bottom: -20px; right: -10px; }

    /* البطاقة الرئيسية */
    .forest-card {
      background: rgba(232, 245, 233, 0.96);
      border: 3px solid #52b788;
      border-radius: 30px;
      width: 100%;
      max-width: 390px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* العنوان الرئيسي المطلوب */
    .main-title {
      font-size: 22px;
      font-weight: 900;
      color: #1b4332;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    /* مكان رهيب للشخصية الخضراء */
    .character-container {
      position: relative;
      width: 100%;
      height: 180px;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid #2d6a4f;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
      margin-bottom: 12px;
    }

    .character-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .character-badge {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: rgba(27, 67, 50, 0.85);
      color: #d8f3dc;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 15px;
      border: 1px solid #74c69d;
    }

    .subtitle {
      color: #2d6a4f;
      font-size: 14px;
      margin: 0 0 15px 0;
      font-weight: 600;
    }

    /* الأزرار الرئيسية */
    .action-btn {
      background: linear-gradient(180deg, #40916c 0%, #1b4332 100%);
      color: white;
      border: 2px solid #081c15;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin: 6px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      transition: transform 0.1s;
    }

    .action-btn:active { transform: scale(0.97); }

    .tea-btn {
      background: linear-gradient(180deg, #9c6644 0%, #582f0e 100%);
    }

    /* قسم النعناع */
    .mint-section {
      background-color: #d8f3dc;
      border: 2px solid #74c69d;
      border-radius: 18px;
      padding: 10px 14px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .mint-section:active { transform: scale(0.98); }
    .mint-img { width: 50px; height: 36px; object-fit: cover; border-radius: 8px; }

    /* لعبة صيد الطماطم */
    .game-area {
      height: 135px;
      background-color: #ffffff;
      border: 2px dashed #52b788;
      border-radius: 18px;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    /* انفجار الطماطم */
    .exploding-tomato {
      position: fixed;
      font-size: 32px;
      pointer-events: none;
      z-index: 999;
      transition: transform 0.8s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 0.8s ease;
    }

    /* بخار الشاهي */
    .rising-tea {
      position: fixed;
      font-size: 28px;
      pointer-events: none;
      z-index: 999;
      animation: rise 1.8s ease-out forwards;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-100px) scale(1.3); opacity: 0; }
    }

    /* النافذة المنبثقة */
    .custom-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex; justify-content: center; align-items: center;
      z-index: 2000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .custom-modal-overlay.active {
      opacity: 1; pointer-events: auto;
    }

    .custom-modal {
      background: #f4fbf7;
      border: 3px solid #1b4332;
      border-radius: 22px;
      padding: 20px 25px;
      text-align: center;
      width: 270px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-btn {
      background: #2d6a4f;
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- أشجار زوايا الشاشة البعيدة -->
  <div class="forest-corner top-left">🌲🌲</div>
  <div class="forest-corner top-right">🌳🌳</div>
  <div class="forest-corner bottom-left">🌳🌲</div>
  <div class="forest-corner bottom-right">🌲🌳</div>

  <div class="forest-card">
    <!-- العنوان -->
    <div class="main-title">🍃 𝑪𝑶𝑶𝑳 𝑴𝑰𝑵𝑻 🍵</div>

    <!-- إطار الشخصية البارز -->
    <div class="character-container">
      <img src="character.jpg" alt="Fern">
      <div class="character-badge">🌿 Fern World</div>
    </div>

    <p class="subtitle">مرحباً بكِ في الملاذ الأخضر</p>

    <!-- الأزرار -->
    <button class="action-btn" onclick="openGift(event)">🎁 افتحي هديتك الاحتفالية!</button>
    <button class="action-btn tea-btn" onclick="drinkTea(event)">🍵 اشرب شاهي</button>

    <!-- قسم أحب النعناع -->
    <div class="mint-section" onclick="clickMint()">
      <img src="mint.jpg" alt="نعناع" class="mint-img">
      <span style="font-weight: bold; color: #1b4332;">أحب النعناع 🌿🌱 <span id="mintCounter">(0)</span></span>
      <span style="font-size: 20px;">🍃</span>
    </div>

    <!-- لعبة صيد الطماطم -->
    <div style="margin-top: 12px;">
      <h3 style="color: #1b4332; margin: 4px 0; font-size: 15px;">🍅 صيد الطماطم 🍅</h3>
      <p style="font-size: 12px; color: #2d6a4f; margin-bottom: 4px;">النقاط: <span id="score">0</span> / 16</p>
      <div class="game-area" id="gameArea"></div>
    </div>
  </div>

  <!-- النافذة المنبثقة -->
  <div class="custom-modal-overlay" id="modalOverlay">
    <div class="custom-modal">
      <h3 id="modalTitle" style="color: #1b4332; margin: 0 0 8px 0;"></h3>
      <p id="modalMessage" style="color: #2d6a4f; font-size: 16px; font-weight: bold; margin: 0;"></p>
      <button class="modal-btn" onclick="closeModal()">طيب</button>
    </div>
  </div>

  <script>
    const clickAudio = new Audio('click.mp3');
    const teaAudio   = new Audio('tea.mp3');
    const giftAudio  = new Audio('gift.mp3');

    function playSound(audio) {
      audio.currentTime = 0;
      audio.play().catch(e => console.log(e));
    }

    // مفاجأة انفجار الطماطم
    function openGift(e) {
      playSound(giftAudio);

      const rect = e.target.getBoundingClientRect();
      const startX = rect.left + rect.width / 2;
      const startY = rect.top + rect.height / 2;

      for (let i = 0; i < 22; i++) {
        const tomato = document.createElement('div');
        tomato.className = 'exploding-tomato';
        tomato.innerText = '🍅';
        tomato.style.left = `${startX}px`;
        tomato.style.top = `${startY}px`;
        document.body.appendChild(tomato);

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 220 + 70;
        const destX = Math.cos(angle) * distance;
        const destY = Math.sin(angle) * distance;

        setTimeout(() => {
          tomato.style.transform = `translate(${destX}px, ${destY}px) rotate(${Math.random() * 500}deg) scale(1.3)`;
          tomato.style.opacity = '0';
        }, 20);

        setTimeout(() => tomato.remove(), 900);
      }

      setTimeout(() => {
        showModal('🎁 المفاجأة', 'كل طماطم! 🍅💥');
      }, 650);
    }

    // زر الشاهي
    function drinkTea(e) {
      playSound(teaAudio);

      const rect = e.target.getBoundingClientRect();
      const startX = rect.left + rect.width / 2;
      const startY = rect.top;

      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          const tea = document.createElement('div');
          tea.className = 'rising-tea';
          tea.innerText = '🍵';
          tea.style.left = `${startX + (Math.random() * 50 - 25)}px`;
          tea.style.top = `${startY}px`;
          document.body.appendChild(tea);
          setTimeout(() => tea.remove(), 1800);
        }, i * 150);
      }
    }

    // زر أحب النعناع
    let mintCount = 0;
    function clickMint() {
      playSound(clickAudio);
      mintCount++;
      document.getElementById('mintCounter').innerText = `(${mintCount})`;
    }

    // لعبة صيد الطماطم
    let score = 0;
    const gameArea = document.getElementById('gameArea');

    function spawnGameTomato() {
      if (score >= 16) return;

      const tomato = document.createElement('div');
      tomato.innerText = '🍅';
      tomato.style.position = 'absolute';
      tomato.style.fontSize = '25px';
      tomato.style.cursor = 'pointer';
      tomato.style.userSelect = 'none';
      tomato.style.top = Math.random() * 85 + 'px';
      tomato.style.left = Math.random() * 270 + 'px';

      tomato.onclick = () => {
        playSound(clickAudio);
        score++;
        document.getElementById('score').innerText = score;
        tomato.remove();
        if (score === 16) {
          showModal('🎉 نهاية اللعبة', 'جمعتِ 16 طماطم بنجاح! 🌿🍅');
        } else {
          spawnGameTomato();
        }
      };

      gameArea.appendChild(tomato);
    }

    function showModal(title, msg) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerText = msg;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    spawnGameTomato();
  </script>
</body>
</html>
