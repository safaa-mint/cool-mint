<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COOL MINT | كلان النعناع 🌿</title>
  <style>
    /* الإعدادات العامة والخلفية */
    * { box-sizing: border-box; }
    body {
      background: #0f2310;
      background-image: radial-gradient(circle at 50% 30%, #1e4620 0%, #0f2310 85%);
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      color: #e8f5e9;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* زوايا الغابة */
    .forest-corner {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0.25;
      font-size: 80px;
      user-select: none;
    }
    .top-left { top: -20px; left: -10px; }
    .top-right { top: -20px; right: -10px; }

    /* الحاوية الرئيسية */
    .main-container {
      width: 100%;
      max-width: 420px;
      z-index: 10;
      text-align: center;
    }

    /* الهيدر والعنوان */
    .clan-header {
      background: rgba(27, 67, 50, 0.85);
      border: 2px solid #52b788;
      border-radius: 25px;
      padding: 20px;
      margin-bottom: 15px;
      backdrop-filter: blur(5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .clan-title {
      font-size: 32px;
      font-weight: 900;
      margin: 0;
      color: #d8f3dc;
      letter-spacing: 1px;
    }
    .clan-subtitle {
      font-size: 15px;
      color: #95d5b2;
      margin-top: 4px;
      font-weight: 600;
    }

    /* أزرار الصفحة الرئيسية */
    .action-btn {
      background: linear-gradient(180deg, #52b788 0%, #2d6a4f 100%);
      color: white;
      border: 2px solid #74c69d;
      padding: 13px 20px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 20px rgba(45, 106, 79, 0.4);
      transition: all 0.2s ease;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .action-btn:hover { transform: translateY(-2px); }
    .action-btn.video-btn {
      background: linear-gradient(180deg, #d8f3dc 0%, #74c69d 100%);
      color: #081c15;
      border-color: #b7e4c7;
    }

    /* قائمة الأعضاء */
    .members-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .members-grid.show {
      opacity: 1;
      max-height: 3000px;
      margin-top: 10px;
    }

    /* كارت العضو بقائمة الاختيار */
    .member-card-preview {
      background: rgba(232, 245, 233, 0.95);
      border: 2px solid #74c69d;
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .member-card-preview:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .preview-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .preview-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2d6a4f;
    }
    .preview-name {
      font-size: 17px;
      font-weight: bold;
      color: #1b4332;
    }
    .preview-role {
      font-size: 12px;
      color: #40916c;
      font-weight: 600;
    }

    /* النوافذ المنبثقة (Modals) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #f4fbf7;
      color: #1b4332;
      border: 3px solid #52b788;
      border-radius: 30px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      position: relative;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    /* البانر العلوي للكارت */
    .profile-banner-container {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
      position: relative;
      overflow: hidden;
    }
    .profile-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* محتوى الكارت أسفل البانر */
    .modal-body-content {
      padding: 0 22px 22px 22px;
    }

    /* صورة الملف الشخصي */
    .profile-img-container {
      width: 100px;
      height: 100px;
      margin: -50px auto 10px auto;
      position: relative;
      z-index: 2;
    }
    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #f4fbf7;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
      background: #2d6a4f;
    }
    .leader-badge {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d6a4f;
      color: #d8f3dc;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid #74c69d;
      white-space: nowrap;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 900;
      margin: 5px 0 2px 0;
      color: #081c15;
    }

    /* شبكة تفاصيل الملف */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 15px 0 12px 0;
      text-align: right;
    }
    .detail-box {
      background: #e8f5e9;
      border: 1px solid #b7e4c7;
      padding: 8px 10px;
      border-radius: 12px;
    }
    .detail-label {
      font-size: 10px;
      color: #40916c;
      font-weight: bold;
      display: block;
      margin-bottom: 2px;
    }
    .detail-value {
      font-size: 12px;
      font-weight: 800;
      color: #1b4332;
    }

    /* قسم الأشياء التي لا تحبها */
    .dislikes-box {
      background: #ffebee;
      border: 1px solid #ffcdd2;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: right;
      margin-bottom: 12px;
    }
    .dislikes-title {
      color: #c62828;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .dislikes-text {
      color: #b71c1c;
      font-size: 12px;
      margin: 0;
      line-height: 1.4;
      font-weight: 600;
    }

    /* مشغل أغنية ريتا - الصورة ثابتة مع مؤثرات موسيقية عند الضغط */
    .rita-player-box {
      background: transparent;
      border: none;
      padding: 10px 0;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
    .vinyl-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 10px auto;
      cursor: pointer;
    }
    .vinyl-record {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
    }
    .vinyl-container:hover .vinyl-record {
      transform: scale(1.05);
    }

    /* النغمات الموسيقية المتطايرة عند التشغيل */
    .music-note {
      position: absolute;
      font-size: 22px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* أنيميشن خروج النغمات من الصورة */
    .vinyl-container.playing .note-1 {
      animation: floatNote1 1.8s infinite ease-out;
    }
    .vinyl-container.playing .note-2 {
      animation: floatNote2 2.1s infinite ease-out 0.4s;
    }
    .vinyl-container.playing .note-3 {
      animation: floatNote3 1.9s infinite ease-out 0.8s;
    }

    @keyframes floatNote1 {
      0% { top: 30%; left: 45%; opacity: 0; transform: scale(0.5) rotate(0deg); }
      50% { opacity: 1; }
      100% { top: -35px; left: 15%; opacity: 0; transform: scale(1.3) rotate(-25deg); }
    }
    @keyframes floatNote2 {
      0% { top: 30%; left: 45%; opacity: 0; transform: scale(0.5) rotate(0deg); }
      50% { opacity: 1; }
      100% { top: -45px; left: 75%; opacity: 0; transform: scale(1.4) rotate(25deg); }
    }
    @keyframes floatNote3 {
      0% { top: 30%; left: 45%; opacity: 0; transform: scale(0.5) rotate(0deg); }
      50% { opacity: 1; }
      100% { top: -50px; left: 45%; opacity: 0; transform: scale(1.5) rotate(-10deg); }
    }

    /* مشغل الراب الخاص بصفاء */
    .rap-player-box {
      background: linear-gradient(135deg, #1b4332 0%, #081c15 100%);
      border: 2px solid #52b788;
      border-radius: 18px;
      padding: 12px 15px;
      margin-bottom: 15px;
      color: white;
      text-align: right;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      display: none;
    }
    .rap-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .rap-title {
      font-size: 13px;
      font-weight: 800;
      color: #74c69d;
    }
    .rap-btn {
      background: #52b788;
      color: #081c15;
      border: none;
      padding: 8px 16px;
      border-radius: 25px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .rap-btn:hover { background: #74c69d; }

    /* مشغل الفيديو */
    .clan-video-player {
      width: 100%;
      border-radius: 18px;
      border: 2px solid #52b788;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      outline: none;
      margin-top: 10px;
    }

    /* زر الإغلاق */
    .close-btn {
      background: #1b4332;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .close-btn:hover { background: #2d6a4f; }
  </style>
</head>
<body>

  <div class="forest-corner top-left">🌲</div>
  <div class="forest-corner top-right">🌳</div>

  <div class="main-container">
    <div class="clan-header">
      <h1 class="clan-title">COOL MINT 🍃</h1>
      <div class="clan-subtitle">كلان النعناع</div>
    </div>

    <button class="action-btn video-btn" onclick="openVideoModal()">
      🎬 نشيد الكلان
    </button>

    <button class="action-btn" onclick="toggleMembers()">
      🔍 اضغط للتعرف على أعضاء كلان النعناع
    </button>

    <div class="members-grid" id="membersGrid"></div>
  </div>

  <div class="modal-overlay" id="videoModal">
    <div class="modal-card" style="padding: 22px;">
      <h3 style="margin: 0 0 10px 0; color: #081c15; font-weight: 900;">🍃 نشيد كلان النعناع ✨</h3>
      
      <video id="clanVideo" class="clan-video-player" controls>
        <source src="mint-video.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
      </video>

      <button class="close-btn" style="margin-top: 15px;" onclick="closeVideoModal()">إغلاق الفيديو</button>
    </div>
  </div>

  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <div class="profile-banner-container">
        <img src="" alt="Banner" class="profile-banner-img" id="mBanner">
      </div>

      <div class="modal-body-content">
        <div class="profile-img-container">
          <img src="" alt="Avatar" class="profile-img" id="mImg">
          <div class="leader-badge" id="mBadge">👑 Leader</div>
        </div>

        <h2 class="profile-name" id="mName">اسم العضو</h2>
        <p style="font-size: 12px; color: #40916c; margin: 0; font-weight: 600;" id="mTitle">الوصف</p>

        <div class="details-grid">
          <div class="detail-box">
            <span class="detail-label">البلد</span>
            <span class="detail-value" id="mCountry">-</span>
          </div>
          <div class="detail-box">
            <span class="detail-label">النمط</span>
            <span class="detail-value" id="mMbti">-</span>
          </div>
          <div class="detail-box">
            <span class="detail-label">الرتبة في الكلان</span>
            <span class="detail-value" id="mRole">-</span>
          </div>
          <div class="detail-box">
            <span class="detail-label">الموهبة / الاهتمام</span>
            <span class="detail-value" style="color: #2d6a4f;" id="mHobby">-</span>
          </div>
        </div>

        <div class="dislikes-box">
          <div class="dislikes-title">🚫 أشياء تكرهها:</div>
          <p class="dislikes-text" id="mDislikes">-</p>
        </div>

        <div class="rita-player-box" id="ritaPlayerBox">
          <div class="vinyl-container" id="vinylContainer" onclick="toggleRitaSong()">
            <img src="IMG_8175-removebg-preview.png" id="vinylImg" class="vinyl-record" alt="Vinyl Record">
            <span class="music-note note-1">🎵</span>
            <span class="music-note note-2">🎶</span>
            <span class="music-note note-3">🎼</span>
          </div>
        </div>

        <div class="rap-player-box" id="rapPlayerBox">
          <div class="rap-header">
            <span class="rap-title">🎤 Minty Bars (راب صفاء) 🔥</span>
          </div>
          <button class="rap-btn" id="rapBtn" onclick="toggleRap()">
            ▶️ اسمعي بارات القائدة
          </button>
        </div>

        <button class="close-btn" onclick="closeProfile()">إغلاق الملف</button>
      </div>
    </div>
  </div>

  <script>
    // صوت نقرة عصري
    function playClickSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch(e) {}
    }

    // ملفات الصوت
    const rapAudio = new Audio('safaa-rap.mp3'); 
    let isRapPlaying = false;

    const ritaAudio = new Audio('rita-song.mp3');
    let isRitaPlaying = false;

    function toggleMembers() {
      playClickSound();
      const grid = document.getElementById('membersGrid');
      grid.classList.toggle('show');
    }

    function openVideoModal() {
      playClickSound();
      document.getElementById('videoModal').classList.add('active');
    }

    function closeVideoModal() {
      playClickSound();
      const vid = document.getElementById('clanVideo');
      vid.pause();
      vid.currentTime = 0;
      document.getElementById('videoModal').classList.remove('active');
    }

    // بيانات جميع أعضاء الكلان
    const membersData = {
      safaa: {
        name: 'صفاء',
        title: 'مؤسسة وقائدة كلان النعناع 🌿',
        country: '🇲🇦 المغرب',
        mbti: 'INFP-T',
        role: 'قائدة الكلان (Leader)',
        badge: '👑 Leader',
        hobby: 'رابر / Leader 🎤',
        dislikes: 'النفاق، التصنع، وقلة الاحترام.',
        image: 'character.jpg',
        banner: '',
        hasRap: true,
        hasRitaSong: false
      },
      sasha: {
        name: 'Sasha',
        title: 'كوليدر كلان النعناع ✨',
        country: '🇮🇶 العراق',
        mbti: 'ENFP',
        role: 'كوليدر (Co-Leader)',
        badge: '⭐ Co-Leader',
        hobby: 'الرسم 🎨',
        dislikes: 'الناس الي تسوي مزح على اقل غلط اسويه، الي يتجاهلون رسايلي او مزاحي، الي يضحكون علي لما ازعل، والي يقطعون العلاقه بسبب شي بسيط.',
        image: 'Sasha.jpg',
        banner: '',
        hasRap: false,
        hasRitaSong: false
      },
      angie: {
        name: '𝖆𝖓𝖌𝖎𝖊ꨄ',
        title: 'آنجي - كوليدر الكلان 🎶',
        country: '🇸🇦 السعودية',
        mbti: 'ENFP-T',
        role: 'كوليدر (Co-Leader)',
        badge: '⭐ Co-Leader',
        hobby: 'الغناء والعزف على البيانو 🎹🎤',
        dislikes: 'الكذابين والمنافقين والحقودين.',
        image: 'prfang.gif',
        banner: 'bnrang.gif',
        hasRap: false,
        hasRitaSong: false
      },
      zohour: {
        name: 'زهور',
        title: 'زهور 🌸',
        country: '🇮🇶 العراق / 🇸🇾 سوريا',
        mbti: 'INFP',
        role: 'عضوة بالكلان',
        badge: '🌿 Member',
        hobby: 'التزيين 🎨✨',
        dislikes: 'اللي تلومني على اشياء ماسويتها، تقرا رسايلي وتتجاهل، تتعمد تغطي على رسالتي عشان محد يرد علي، يغير الموضوع وانا اسولف، يقاطعني، يقول شيء عن نفسه بدون سبب لما اتكلم عن شيء سويته، الكذابين، واللي يحشون فيني وانا ماسويتلهم شيء واذا سويت يزعلون.',
        image: 'zohour.jpg',
        banner: '',
        hasRap: false,
        hasRitaSong: false
      },
      rival: {
        name: 'rival',
        title: 'ريفال 🐎',
        country: '🇸🇦 السعودية',
        mbti: 'INTJ',
        role: 'عضوة بالكلان',
        badge: '🌿 Member',
        hobby: 'ركوب الخيل (تحب اللي يفهمها علطول) 🐴',
        dislikes: 'اللي يحشون علي من وراي.',
        image: 'rival.jpg',
        banner: '',
        hasRap: false,
        hasRitaSong: false
      },
      rita: {
        name: 'rita',
        title: 'ريتا (غزل) ❄️',
        country: '🇸🇦 السعودية',
        mbti: 'ENTP',
        role: 'عضوة بالكلان',
        badge: '🌿 Member',
        hobby: 'التزلج على الثلج، الرسم، كتابة القصص 📖🎨',
        dislikes: 'الكذب، التجاهل، ودعم الشذوذ.',
        image: 'rita.jpg',
        banner: 'banerrita.gif',
        hasRap: false,
        hasRitaSong: true
      },
      cocount: {
        name: 'cocount',
        title: 'كوكنت 🥥',
        country: '🇸🇦 السعودية',
        mbti: 'ISFP',
        role: 'عضوة بالكلان',
        badge: '🌿 Member',
        hobby: 'الرسم والطبخ 🍳🎨',
        dislikes: 'النفاق.',
        image: 'cocount.jpg',
        banner: '',
        hasRap: false,
        hasRitaSong: false
      }
    };

    // توليد قائمة الأعضاء
    function renderMembersList() {
      const grid = document.getElementById('membersGrid');
      grid.innerHTML = '';
      for (let id in membersData) {
        const m = membersData[id];
        grid.innerHTML += `
          <div class="member-card-preview" onclick="openProfile('${id}')">
            <div class="preview-info">
              <img src="${m.image}" alt="${m.name}" class="preview-avatar" onerror="this.src='character.jpg'">
              <div style="text-align: right;">
                <div class="preview-name">${m.name}</div>
                <div class="preview-role">${m.badge} - ${m.role}</div>
              </div>
            </div>
            <span style="color: #2d6a4f; font-weight: bold; font-size: 18px;">←</span>
          </div>
        `;
      }
    }
    renderMembersList();

    // تشغيل وإيقاف تشغيل أغنية ريتا بالضغط على صورة القرص مباشرة
    function toggleRitaSong() {
      playClickSound();
      const container = document.getElementById('vinylContainer');

      if (!isRitaPlaying) {
        ritaAudio.play().then(() => {
          isRitaPlaying = true;
          container.classList.add('playing');
        }).catch(err => {
          // حتى في حال عدم وجود ملف الصوت يظهر تأثير النغمات لتجربة التفاعل
          isRitaPlaying = true;
          container.classList.add('playing');
        });
      } else {
        stopRitaSong();
      }
    }

    function stopRitaSong() {
      ritaAudio.pause();
      ritaAudio.currentTime = 0;
      isRitaPlaying = false;
      const container = document.getElementById('vinylContainer');
      if (container) container.classList.remove('playing');
    }

    ritaAudio.onended = function() { stopRitaSong(); };

    // تشغيل وإيقاف الراب (لصفاء)
    function toggleRap() {
      playClickSound();
      const btn = document.getElementById('rapBtn');
      if (!isRapPlaying) {
        rapAudio.play().then(() => {
          isRapPlaying = true;
          btn.innerHTML = '⏸️ إيقاف المقطع';
          btn.style.background = '#e63946';
          btn.style.color = 'white';
        }).catch(err => {
          alert('يرجى التأكد من رفع ملف الصوت باسم safaa-rap.mp3');
        });
      } else {
        stopRap();
      }
    }

    function stopRap() {
      rapAudio.pause();
      rapAudio.currentTime = 0;
      isRapPlaying = false;
      const btn = document.getElementById('rapBtn');
      if (btn) {
        btn.innerHTML = '▶️ اسمعي بارات القائدة';
        btn.style.background = '#52b788';
        btn.style.color = '#081c15';
      }
    }

    rapAudio.onended = function() { stopRap(); };

    // فتح الملف الشخصي
    function openProfile(memberId) {
      playClickSound();
      const data = membersData[memberId];
      if (!data) return;

      document.getElementById('mName').innerText = data.name;
      document.getElementById('mTitle').innerText = data.title;
      document.getElementById('mCountry').innerText = data.country;
      document.getElementById('mMbti').innerText = data.mbti;
      document.getElementById('mRole').innerText = data.role;
      document.getElementById('mHobby').innerText = data.hobby;
      document.getElementById('mBadge').innerText = data.badge;
      document.getElementById('mDislikes').innerText = data.dislikes;
      
      // صورة البروفايل
      const imgElem = document.getElementById('mImg');
      imgElem.src = data.image;
      imgElem.onerror = function() { this.src = 'character.jpg'; };

      // البانر العلوي
      const bannerImg = document.getElementById('mBanner');
      if (data.banner && data.banner.trim() !== '') {
        bannerImg.src = data.banner;
        bannerImg.style.display = 'block';
      } else {
        bannerImg.style.display = 'none';
      }

      // مشغل صفاء
      const rapBox = document.getElementById('rapPlayerBox');
      rapBox.style.display = data.hasRap ? 'block' : 'none';

      // مشغل ريتا
      const ritaBox = document.getElementById('ritaPlayerBox');
      ritaBox.style.display = data.hasRitaSong ? 'block' : 'none';

      document.getElementById('profileModal').classList.add('active');
    }

    // إغلاق الملف الشخصي
    function closeProfile() {
      playClickSound();
      stopRap();
      stopRitaSong();
      document.getElementById('profileModal').classList.remove('active');
    }
  </script>
</body>
</html>
