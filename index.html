<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COOL MINT - كلان النعناع الرسمي</title>
    <style>
        /* ==================== إعادة ضبط وإعدادات عامة ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b1f13;
            background-image: radial-gradient(circle at center, #0f2e1c 0%, #08170d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        /* ==================== الحاوية الرئيسية ==================== */
        .clan-bar-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1100px;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* ==================== قسم الهوية (يمين) ==================== */
        .clan-card {
            background: rgba(16, 46, 28, 0.85);
            border: 2px solid #2e8b57;
            border-radius: 30px;
            padding: 15px 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .clan-logo {
            width: 42px;
            height: 42px;
        }

        .clan-info {
            display: flex;
            flex-direction: column;
        }

        .clan-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .clan-subtitle {
            font-size: 14px;
            color: #5cdb95;
            font-weight: 600;
            margin-top: -2px;
        }

        /* ==================== قسم الأزرار (يسار) ==================== */
        .buttons-group {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 10; /* ضمان وجود الأزرار فوق باقي العناصر */
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            position: relative;
            z-index: 15;
            pointer-events: auto !important; /* ضمان استجابة الماوس للنقر */
        }

        /* زر نشيد الكلان */
        .btn-anthem {
            background-color: #a3f3c3;
            color: #0b2414;
            border: none;
            box-shadow: 0 4px 15px rgba(163, 243, 195, 0.3);
        }

        .btn-anthem:hover {
            background-color: #c0f7d5;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 20px rgba(163, 243, 195, 0.5);
        }

        .btn-anthem:active {
            transform: translateY(1px) scale(0.98);
        }

        /* زر أعضاء كلان النعناع */
        .btn-members {
            background-color: #1a4d30;
            color: #ffffff;
            border: 2px solid #3dbb79;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-members:hover {
            background-color: #246842;
            border-color: #52e096;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 20px rgba(61, 187, 121, 0.4);
        }

        .btn-members:active {
            transform: translateY(1px) scale(0.98);
        }

        /* ==================== النوافذ المنبثقة (Modal) ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: #112d1c;
            border: 2px solid #3dbb79;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(61, 187, 121, 0.3);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 18px;
            color: #5cdb95;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #fff;
        }

        .members-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .member-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-role {
            font-size: 12px;
            background: #3dbb79;
            color: #0b1f13;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="clan-bar-container">
        <!-- الأزرار التفاعلية (على اليسار) -->
        <div class="buttons-group">
            <button class="btn btn-members" id="btnMembers">
                <span>أعضاء كلان النعناع</span>
                🔍
            </button>
            <button class="btn btn-anthem" id="btnAnthem">
                <span>نشيد الكلان</span>
                🎬
            </button>
        </div>

        <!-- بطاقة الكلان الرسمية (على اليمين) -->
        <div class="clan-card">
            <div class="clan-info">
                <div class="clan-title">COOL MINT</div>
                <div class="clan-subtitle">كلان النعناع الرسمي</div>
            </div>
            <!-- أيقونة النعناع SVG -->
            <svg class="clan-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M52 12C40 12 20 22 16 48C28 48 48 38 52 12Z" fill="#4fe08d" stroke="#1d5c38" stroke-width="3"/>
                <path d="M16 48C24 36 36 26 52 12" stroke="#1d5c38" stroke-width="3" stroke-linecap="round"/>
                <path d="M28 32L22 28M36 24L32 18M42 18L40 12" stroke="#1d5c38" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 20C18 22 20 28 20 28" stroke="#72efdd" stroke-width="3" stroke-linecap="round"/>
                <path d="M8 28C14 30 16 36 16 36" stroke="#72efdd" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <!-- نافذة قائمة الأعضاء -->
    <div class="modal-overlay" id="membersModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">🔍 أعضاء كلان النعناع</h3>
                <button class="close-btn" onclick="closeModal('membersModal')">&times;</button>
            </div>
            <ul class="members-list">
                <li class="member-item">
                    <span>MINT_Leader</span>
                    <span class="member-role">القائد</span>
                </li>
                <li class="member-item">
                    <span>MINT_Sniper</span>
                    <span class="member-role">نائب القائد</span>
                </li>
                <li class="member-item">
                    <span>MINT_Shadow</span>
                    <span class="member-role">عضو متقدم</span>
                </li>
                <li class="member-item">
                    <span>MINT_Ghost</span>
                    <span class="member-role">عضو</span>
                </li>
            </ul>
        </div>
    </div>

    <!-- نافذة نشيد الكلان -->
    <div class="modal-overlay" id="anthemModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">🎬 نشيد كلان النعناع</h3>
                <button class="close-btn" onclick="closeModal('anthemModal')">&times;</button>
            </div>
            <div style="text-align: center; padding: 10px 0;">
                <p style="margin-bottom: 15px; color: #a3f3c3; line-height: 1.6;">
                    "نحن النعناع في الميدان نسود... قوة وثبات بلا حدود!"
                </p>
                <audio controls style="width: 100%; border-radius: 10px; outline: none;">
                    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                    متصفحك لا يدعم مشغل الصوت.
                </audio>
            </div>
        </div>
    </div>

    <!-- ==================== JavaScript لإدارة الضغط والأحداث ==================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnMembers = document.getElementById('btnMembers');
            const btnAnthem = document.getElementById('btnAnthem');
            const membersModal = document.getElementById('membersModal');
            const anthemModal = document.getElementById('anthemModal');

            // ربط ضغطة زر الأعضاء
            btnMembers.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal('membersModal');
            });

            // ربط ضغطة زر النشيد
            btnAnthem.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal('anthemModal');
            });

            // إغلاق النافذة عند الضغط على الخلفية
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.classList.remove('active');
                    }
                });
            });
        });

        // دوال فتح وإغلاق النوافذ المنبثقة
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
    </script>
</body>
</html>
