<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COOL MINT - كلان النعناع الرسمي</title>
    <style>
        /* ==================== إعادة ضبط وإعدادات عامة ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b1f13;
            background-image: radial-gradient(circle at center, #0f2e1c 0%, #08170d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        /* ==================== الحاوية الرئيسية ==================== */
        .clan-bar-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1100px;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* ==================== قسم الهوية (يمين) ==================== */
        .clan-card {
            background: rgba(16, 46, 28, 0.85);
            border: 2px solid #2e8b57;
            border-radius: 30px;
            padding: 15px 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .clan-logo {
            width: 42px;
            height: 42px;
        }

        .clan-info {
            display: flex;
            flex-direction: column;
        }

        .clan-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .clan-subtitle {
            font-size: 14px;
            color: #5cdb95;
            font-weight: 600;
            margin-top: -2px;
        }

        /* ==================== قسم الأزرار (يسار) ==================== */
        .buttons-group {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 10;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            position: relative;
            z-index: 15;
            pointer-events: auto !important;
        }

        /* زر نشيد الكلان */
        .btn-anthem {
            background-color: #a3f3c3;
            color: #0b2414;
            border: none;
            box-shadow: 0 4px 15px rgba(163, 243, 195, 0.3);
        }

        .btn-anthem:hover {
            background-color: #c0f7d5;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 20px rgba(163, 243, 195, 0.5);
        }

        .btn-anthem:active {
            transform: translateY(1px) scale(0.98);
        }

        /* زر أعضاء كلان النعناع */
        .btn-members {
            background-color: #1a4d30;
            color: #ffffff;
            border: 2px solid #3dbb79;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-members:hover {
            background-color: #246842;
            border-color: #52e096;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 20px rgba(61, 187, 121, 0.4);
        }

        .btn-members:active {
            transform: translateY(1px) scale(0.98);
        }

        /* ==================== النوافذ المنبثقة (Modal) ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: #112d1c;
            border: 2px solid #3dbb79;
            border-radius: 24px;
            padding: 25px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(61, 187, 121, 0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(61, 187, 121, 0.3);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            color: #5cdb95;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #fff;
        }

        /* قائمة الأعضاء */
        .members-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .member-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-role {
            font-size: 12px;
            background: #3dbb79;
            color: #0b1f13;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* ==================== تصميم مشغل أسطوانة الفينيل (Vinyl Player) ==================== */
        .vinyl-player-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 10px 0;
        }

        /* المشغل والأسطوانة */
        .turntable {
            position: relative;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #1a3c27 0%, #0b1c12 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.8), 0 0 20px rgba(61, 187, 121, 0.2);
            border: 4px solid #246842;
        }

        /* قرص الفينيل */
        .vinyl-disc {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.8) 36%),
                repeating-radial-gradient(135deg, #111 0px, #1a1a1a 2px, #111 4px, #222 5px),
                linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 40%, rgba(255,255,255,0.15) 100%);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.9);
            transition: transform 0.5s ease;
        }

        /* تأثير الدوران عند التشغيل */
        .vinyl-disc.playing {
            animation: spinVinyl 3s linear infinite;
        }

        @keyframes spinVinyl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ملصق منتصف الأسطوانة */
        .vinyl-label {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #246842, #3dbb79);
            border: 3px solid #a3f3c3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .vinyl-label-text {
            font-size: 9px;
            font-weight: 900;
            color: #0b1f13;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        /* الثقب الأوسط للأسطوانة */
        .vinyl-center-hole {
            width: 14px;
            height: 14px;
            background-color: #0b1f13;
            border: 2px solid #a3f3c3;
            border-radius: 50%;
            margin-top: 4px;
        }

        /* ذراع التشغيل (Tonearm) */
        .tonearm {
            position: absolute;
            top: 10px;
            left: 20px;
            width: 60px;
            height: 90px;
            z-index: 10;
            pointer-events: none;
            transform-origin: 15px 15px;
            transform: rotate(-32deg);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tonearm.on-record {
            transform: rotate(0deg);
        }

        .tonearm-base {
            width: 26px;
            height: 26px;
            background: #444;
            border: 2px solid #777;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .tonearm-stick {
            width: 4px;
            height: 70px;
            background: linear-gradient(to bottom, #ccc, #888);
            position: absolute;
            top: 12px;
            left: 11px;
            border-radius: 2px;
        }

        .tonearm-head {
            width: 10px;
            height: 16px;
            background: #3dbb79;
            position: absolute;
            bottom: 5px;
            left: 8px;
            border-radius: 2px;
            box-shadow: 0 0 5px #3dbb79;
        }

        /* تفاصيل أغنية Toxic till the end */
        .song-title-display {
            text-align: center;
        }

        .song-title-main {
            font-size: 20px;
            font-weight: bold;
            color: #a3f3c3;
            text-shadow: 0 0 10px rgba(163, 243, 195, 0.4);
            letter-spacing: 1px;
        }

        .song-subtitle {
            font-size: 13px;
            color: #5cdb95;
            margin-top: 3px;
            opacity: 0.85;
        }

        /* شريط التحكم والتشغيل */
        .player-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-text {
            font-size: 11px;
            color: #5cdb95;
            min-width: 35px;
            text-align: center;
            font-family: monospace;
        }

        .progress-bar-bg {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3dbb79, #a3f3c3);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* زر التشغيل القوي */
        .play-btn-large {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a3f3c3, #3dbb79);
            border: none;
            color: #0b1f13;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(61, 187, 121, 0.4);
            transition: all 0.2s ease;
        }

        .play-btn-large:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(163, 243, 195, 0.6);
        }

        .play-btn-large:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="clan-bar-container">
        <!-- الأزرار التفاعلية (على اليسار) -->
        <div class="buttons-group">
            <button class="btn btn-members" id="btnMembers">
                <span>أعضاء كلان النعناع</span>
                🔍
            </button>
            <button class="btn btn-anthem" id="btnAnthem">
                <span>نشيد الكلان</span>
                🎬
            </button>
        </div>

        <!-- بطاقة الكلان الرسمية (على اليمين) -->
        <div class="clan-card">
            <div class="clan-info">
                <div class="clan-title">COOL MINT</div>
                <div class="clan-subtitle">كلان النعناع الرسمي</div>
            </div>
            <!-- أيقونة النعناع SVG -->
            <svg class="clan-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M52 12C40 12 20 22 16 48C28 48 48 38 52 12Z" fill="#4fe08d" stroke="#1d5c38" stroke-width="3"/>
                <path d="M16 48C24 36 36 26 52 12" stroke="#1d5c38" stroke-width="3" stroke-linecap="round"/>
                <path d="M28 32L22 28M36 24L32 18M42 18L40 12" stroke="#1d5c38" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 20C18 22 20 28 20 28" stroke="#72efdd" stroke-width="3" stroke-linecap="round"/>
                <path d="M8 28C14 30 16 36 16 36" stroke="#72efdd" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <!-- نافذة قائمة الأعضاء -->
    <div class="modal-overlay" id="membersModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">🔍 أعضاء كلان النعناع</h3>
                <button class="close-btn" onclick="closeModal('membersModal')">&times;</button>
            </div>
            <ul class="members-list">
                <li class="member-item">
                    <span>MINT_Leader</span>
                    <span class="member-role">القائد</span>
                </li>
                <li class="member-item">
                    <span>MINT_Sniper</span>
                    <span class="member-role">نائب القائد</span>
                </li>
                <li class="member-item">
                    <span>MINT_Shadow</span>
                    <span class="member-role">عضو متقدم</span>
                </li>
                <li class="member-item">
                    <span>MINT_Ghost</span>
                    <span class="member-role">عضو</span>
                </li>
            </ul>
        </div>
    </div>

    <!-- نافذة نشيد الكلان (أسطوانة الفينيل المتحركة) -->
    <div class="modal-overlay" id="anthemModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">🎵 نشيد النعناع الرسمي</h3>
                <button class="close-btn" onclick="closeModal('anthemModal')">&times;</button>
            </div>

            <!-- مشغل الأسطوانة -->
            <div class="vinyl-player-container">
                
                <!-- الأسطوانة مع الذراع -->
                <div class="turntable">
                    <div class="tonearm" id="tonearm">
                        <div class="tonearm-base"></div>
                        <div class="tonearm-stick"></div>
                        <div class="tonearm-head"></div>
                    </div>
                    <div class="vinyl-disc" id="vinylDisc">
                        <div class="vinyl-label">
                            <span class="vinyl-label-text">Toxic till<br>the end</span>
                            <div class="vinyl-center-hole"></div>
                        </div>
                    </div>
                </div>

                <!-- عنوان الأغنية -->
                <div class="song-title-display">
                    <div class="song-title-main">Toxic till the end</div>
                    <div class="song-subtitle">"نحن النعناع في الميدان نسود... قوة وثبات بلا حدود!"</div>
                </div>

                <!-- شريط الصوت وأزرار التشغيل -->
                <div class="player-controls">
                    <div class="progress-container">
                        <span class="time-text" id="currentTime">0:00</span>
                        <div class="progress-bar-bg" id="progressBarBg">
                            <div class="progress-bar-fill" id="progressBarFill"></div>
                        </div>
                        <span class="time-text" id="durationTime">0:00</span>
                    </div>

                    <button class="play-btn-large" id="playPauseBtn">
                        <span id="playIcon">▶</span>
                    </button>
                </div>

                <!-- عنصر الصوت الخلفي -->
                <audio id="anthemAudio" src="angiesound.mp3" preload="metadata"></audio>
            </div>
        </div>
    </div>

    <!-- ==================== JavaScript لإدارة الضغط والأحداث والأسطوانة ==================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnMembers = document.getElementById('btnMembers');
            const btnAnthem = document.getElementById('btnAnthem');
            const membersModal = document.getElementById('membersModal');
            const anthemModal = document.getElementById('anthemModal');

            // عناصر مشغل الأسطوانة
            const audio = document.getElementById('anthemAudio');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const playIcon = document.getElementById('playIcon');
            const vinylDisc = document.getElementById('vinylDisc');
            const tonearm = document.getElementById('tonearm');
            const progressBarBg = document.getElementById('progressBarBg');
            const progressBarFill = document.getElementById('progressBarFill');
            const currentTimeEl = document.getElementById('currentTime');
            const durationTimeEl = document.getElementById('durationTime');

            // فتح نافذة الأعضاء
            btnMembers.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal('membersModal');
            });

            // فتح نافذة الأسطوانة والنشيد
            btnAnthem.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal('anthemModal');
            });

            // إغلاق النوافذ عند الضغط على الخلفية
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        closeModal(overlay.id);
                    }
                });
            });

            // ==================== التحكم بالأسطوانة والصوت ====================
            function togglePlay() {
                if (audio.paused) {
                    audio.play().then(() => {
                        playIcon.textContent = '⏸';
                        vinylDisc.classList.add('playing');
                        tonearm.classList.add('on-record');
                    }).catch(err => {
                        console.log("تنبيه: تأكد من وجود ملف angiesound.mp3 في مسار المشروع.", err);
                    });
                } else {
                    pauseAudio();
                }
            }

            function pauseAudio() {
                audio.pause();
                playIcon.textContent = '▶';
                vinylDisc.classList.remove('playing');
                tonearm.classList.remove('on-record');
            }

            playPauseBtn.addEventListener('click', togglePlay);

            // تحديث الوقت وشريط التقدم
            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    progressBarFill.style.width = `${progressPercent}%`;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            });

            audio.addEventListener('loadedmetadata', () => {
                durationTimeEl.textContent = formatTime(audio.duration);
            });

            // تقديم ورجوع عند الضغط على شريط التقدم
            progressBarBg.addEventListener('click', (e) => {
                const rect = progressBarBg.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const width = rect.width;
                if (audio.duration) {
                    audio.currentTime = (clickX / width) * audio.duration;
                }
            });

            // عند انتهاء الأغنية
            audio.addEventListener('ended', () => {
                pauseAudio();
                progressBarFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
            });

            // إعادة ضبط الصوت والأسطوانة عند إغلاق النافذة
            window.closeModal = function(modalId) {
                document.getElementById(modalId).classList.remove('active');
                if (modalId === 'anthemModal') {
                    pauseAudio();
                }
            };

            window.openModal = function(modalId) {
                document.getElementById(modalId).classList.add('active');
            };

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
        });
    </script>
</body>
</html>
