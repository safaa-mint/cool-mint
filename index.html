<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COOL MINT | كلان النعناع 🌿</title>
  <style>
    /* الإعدادات العامة والخلفية */
    * { 
      box-sizing: border-box; 
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      user-select: none;
    }
    
    body {
      background: #08140c;
      background-image: radial-gradient(circle at 50% 20%, #122e1b 0%, #061009 85%);
      color: #e8f5e9;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* زوايا الغابة */
    .forest-corner {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0.15;
      font-size: 80px;
    }
    .top-left { top: -20px; left: -10px; }
    .top-right { top: -20px; right: -10px; }

    /* الحاوية الرئيسية */
    .main-container {
      width: 100%;
      max-width: 960px;
      z-index: 10;
      text-align: center;
    }

    /* شريط العنوان والأزرار أفقياً */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    /* الهيدر والعنوان */
    .clan-header {
      background: rgba(18, 46, 27, 0.6);
      border: 1px solid rgba(82, 183, 136, 0.3);
      border-radius: 20px;
      padding: 15px 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      flex: 1;
      min-width: 280px;
      text-align: right;
    }
    .clan-title {
      font-size: 26px;
      font-weight: 900;
      margin: 0;
      color: #d8f3dc;
      letter-spacing: 1px;
    }
    .clan-subtitle {
      font-size: 13px;
      color: #74c69d;
      margin-top: 2px;
      font-weight: 600;
    }

    /* أزرار التحكم الفوقية */
    .controls-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: flex-end;
    }

    .action-btn {
      background: rgba(45, 106, 79, 0.4);
      color: #d8f3dc;
      border: 1px solid rgba(82, 183, 136, 0.4);
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }
    .action-btn:hover { 
      background: rgba(82, 183, 136, 0.25);
      border-color: #52b788;
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(82, 183, 136, 0.2);
    }
    .action-btn.video-btn {
      background: linear-gradient(135deg, #52b788 0%, #2d6a4f 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 15px rgba(82, 183, 136, 0.3);
    }
    .action-btn.video-btn:hover {
      box-shadow: 0 6px 22px rgba(82, 183, 136, 0.5);
    }

    /* قائمة الأعضاء شبكة أفقية */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .members-grid.show {
      opacity: 1;
      max-height: 2000px;
      margin-top: 15px;
    }

    /* كارت العضو بقائمة الاختيار */
    .member-card-preview {
      background: rgba(18, 46, 27, 0.5);
      border: 1px solid rgba(82, 183, 136, 0.25);
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    .member-card-preview:hover {
      transform: translateY(-3px);
      background: rgba(27, 67, 50, 0.7);
      border-color: #52b788;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .preview-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .preview-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #52b788;
    }
    .preview-name {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
    }
    .preview-role {
      font-size: 12px;
      color: #74c69d;
      font-weight: 600;
    }

    /* النوافذ المنبثقة (Modals) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(4, 12, 7, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* نافذة الكارت العصرية المبرمجة حديثاً */
    .modal-card {
      background: rgba(13, 31, 20, 0.95);
      color: #ffffff;
      border: 1px solid rgba(82, 183, 136, 0.35);
      border-radius: 24px;
      width: 100%;
      max-width: 680px;
      position: relative;
      transform: scale(0.9);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    /* زر إغلاق علوي أنيق */
    .top-close-icon {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 32px;
      height: 32px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s ease;
    }
    .top-close-icon:hover {
      background: rgba(239, 68, 68, 0.8);
      border-color: #ef4444;
    }

    /* البانر العلوي */
    .profile-banner-container {
      width: 100%;
      height: 110px;
      background: linear-gradient(135deg, #1b4332 0%, #081c15 100%);
      position: relative;
    }
    .profile-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* محتوى الكارت المطور */
    .modal-body-layout {
      padding: 0 25px 25px 25px;
      text-align: right;
    }

    /* كرت الهوية السريع بالأعلى */
    .profile-header-summary {
      display: flex;
      align-items: flex-end;
      gap: 18px;
      margin-top: -45px;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    .profile-img-container {
      width: 90px;
      height: 90px;
      position: relative;
      flex-shrink: 0;
    }
    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #52b788;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      background: #112d1c;
    }

    .profile-title-group {
      flex: 1;
      padding-bottom: 5px;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .leader-badge {
      background: rgba(82, 183, 136, 0.2);
      color: #74c69d;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(82, 183, 136, 0.4);
      display: inline-block;
    }

    .profile-subtitle-text {
      font-size: 13px;
      color: #95d5b2;
      margin-top: 3px;
      font-weight: 500;
    }

    /* شبكة تفاصيل الملف Glassmorphic */
    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }
    @media (max-width: 500px) {
      .details-grid { grid-template-columns: 1fr; }
    }

    .detail-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: 14px;
      transition: all 0.2s ease;
    }
    .detail-box:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(82, 183, 136, 0.3);
    }
    .detail-label {
      font-size: 11px;
      color: #74c69d;
      font-weight: 600;
      display: block;
      margin-bottom: 3px;
    }
    .detail-value {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    /* قسم الأشياء التي لا تحبها مدمج وأنيق */
    .dislikes-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 14px;
      padding: 12px 15px;
      margin-bottom: 18px;
    }
    .dislikes-title {
      color: #fca5a5;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dislikes-text {
      color: #f87171;
      font-size: 13px;
      margin: 0;
      line-height: 1.5;
      font-weight: 500;
    }

    /* مشغل أغنية ريتا */
    .rita-player-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      display: none;
      margin-bottom: 15px;
    }
    .vinyl-container {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 5px auto;
      cursor: pointer;
    }
    .vinyl-record {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .song-title-text {
      font-size: 12px;
      font-weight: 700;
      color: #74c69d;
      margin-top: 4px;
    }

    /* مشغل الراب الخاص بصفاء */
    .rap-player-box {
      background: linear-gradient(135deg, rgba(82, 183, 136, 0.2) 0%, rgba(27, 67, 50, 0.4) 100%);
      border: 1px solid #52b788;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      display: none;
      margin-bottom: 15px;
    }
    .rap-title {
      font-size: 12px;
      font-weight: 800;
      color: #d8f3dc;
      margin-bottom: 6px;
      display: block;
    }
    .rap-btn {
      background: #52b788;
      color: #081c15;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }
    .rap-btn:hover { background: #74c69d; }

    /* مشغل الفيديو */
    .clan-video-player {
      width: 100%;
      border-radius: 16px;
      border: 1px solid #52b788;
      outline: none;
      margin-top: 10px;
    }

    /* زر الإغلاق السفلي */
    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 11px 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    .close-btn:hover { 
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);

        dislikes: 'الكذب، التجاهل، ودعم الشذوذ.',
        image: 'rita.jpg',
        banner: 'banerrita.gif',
        hasRap: false,
        hasRitaSong: true
      },
      cocount: {
        name: 'cocount',
        title: 'كوكنت 🥥',
        country: '🇸🇦 السعودية',
        mbti: 'ISFP',
        role: 'عضوة بالكلان',
        badge: '🌿 Member',
        hobby: 'الرسم والطبخ 🍳🎨',
        dislikes: 'النفاق.',
        image: 'cocount.jpg',
        banner: '',
        hasRap: false,
        hasRitaSong: false
      }
    };

    function renderMembersList() {
      const grid = document.getElementById('membersGrid');
      grid.innerHTML = '';
      for (let id in membersData) {
        const m = membersData[id];
        grid.innerHTML += `
          <div class="member-card-preview" onclick="openProfile('${id}')">
            <div class="preview-info">
              <img src="${m.image}" alt="${m.name}" class="preview-avatar" onerror="this.src='character.jpg'">
              <div style="text-align: right;">
                <div class="preview-name">${m.name}</div>
                <div class="preview-role">${m.badge}</div>
              </div>
            </div>
            <span style="color: #52b788; font-weight: bold; font-size: 16px;">←</span>
          </div>
        `;
      }
    }
    renderMembersList();

    function toggleRitaSong() {
      playClickSound();
      if (!isRitaPlaying) {
        ritaAudio.play().then(() => {
          isRitaPlaying = true;
        }).catch(() => { isRitaPlaying = true; });
      } else {
        stopRitaSong();
      }
    }

    function stopRitaSong() {
      ritaAudio.pause();
      ritaAudio.currentTime = 0;
      isRitaPlaying = false;
    }

    ritaAudio.onended = function() { stopRitaSong(); };

    function toggleRap() {
      playClickSound();
      const btn = document.getElementById('rapBtn');
      if (!isRapPlaying) {
        rapAudio.play().then(() => {
          isRapPlaying = true;
          btn.innerHTML = '⏸️ إيقاف المقطع';
          btn.style.background = '#e63946';
          btn.style.color = 'white';
        }).catch(err => {
          alert('يرجى التأكد من رفع ملف الصوت باسم safaa-rap.mp3');
        });
      } else {
        stopRap();
      }
    }

    function stopRap() {
      rapAudio.pause();
      rapAudio.currentTime = 0;
      isRapPlaying = false;
      const btn = document.getElementById('rapBtn');
      if (btn) {
        btn.innerHTML = '▶️ اسمعي بارات القائدة';
        btn.style.background = '#52b788';
        btn.style.color = '#081c15';
      }
    }

    rapAudio.onended = function() { stopRap(); };

    function openProfile(memberId) {
      playClickSound();
      const data = membersData[memberId];
      if (!data) return;

      document.getElementById('mName').innerText = data.name;
      document.getElementById('mTitle').innerText = data.title;
      document.getElementById('mCountry').innerText = data.country;
      document.getElementById('mMbti').innerText = data.mbti;
      document.getElementById('mRole').innerText = data.role;
      document.getElementById('mHobby').innerText = data.hobby;
      document.getElementById('mBadge').innerText = data.badge;
      document.getElementById('mDislikes').innerText = data.dislikes;
      
      const imgElem = document.getElementById('mImg');
      imgElem.src = data.image;
      imgElem.onerror = function() { this.src = 'character.jpg'; };

      const bannerImg = document.getElementById('mBanner');
      if (data.banner && data.banner.trim() !== '') {
        bannerImg.src = data.banner;
        bannerImg.style.display = 'block';
      } else {
        bannerImg.style.display = 'none';
      }

      const rapBox = document.getElementById('rapPlayerBox');
      rapBox.style.display = data.hasRap ? 'block' : 'none';

      const ritaBox = document.getElementById('ritaPlayerBox');
      ritaBox.style.display = data.hasRitaSong ? 'block' : 'none';

      document.getElementById('profileModal').classList.add('active');
    }

    function closeProfile() {
      playClickSound();
      stopRap();
      stopRitaSong();
      document.getElementById('profileModal').classList.remove('active');
    }
  </script>
</body>
</html>
