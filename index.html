<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINT CLAN | كلان النعناع 🌿</title>
  <style>
    /* الإعدادات العامة وخلفية الغابة */
    * { box-sizing: border-box; }
    body {
      background: #0f2310;
      background-image: radial-gradient(circle at 50% 30%, #1e4620 0%, #0f2310 85%);
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      color: #e8f5e9;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* زوايا شجر خلفية */
    .forest-corner {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0.25;
      font-size: 80px;
      user-select: none;
    }
    .top-left { top: -20px; left: -10px; }
    .top-right { top: -20px; right: -10px; }

    /* الحاوية الرئيسية */
    .main-container {
      width: 100%;
      max-width: 420px;
      z-index: 10;
      text-align: center;
    }

    /* الهيدر والعنوان */
    .clan-header {
      background: rgba(27, 67, 50, 0.85);
      border: 2px solid #52b788;
      border-radius: 25px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .clan-title {
      font-size: 26px;
      font-weight: 900;
      margin: 0;
      color: #d8f3dc;
      letter-spacing: 1px;
    }
    .clan-subtitle {
      font-size: 14px;
      color: #95d5b2;
      margin-top: 5px;
    }

    /* زر التعرف على الأعضاء */
    .explore-btn {
      background: linear-gradient(180deg, #52b788 0%, #2d6a4f 100%);
      color: white;
      border: 2px solid #74c69d;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 20px rgba(45, 106, 79, 0.4);
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }
    .explore-btn:hover { transform: translateY(-2px); }
    .explore-btn:active { transform: translateY(1px); }

    /* قائمة الأعضاء */
    .members-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .members-grid.show {
      opacity: 1;
      max-height: 1000px;
    }

    /* كارت العضو بقائمة الاختيار */
    .member-card-preview {
      background: rgba(232, 245, 233, 0.95);
      border: 2px solid #74c69d;
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .member-card-preview:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .preview-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .preview-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2d6a4f;
    }
    .preview-name {
      font-size: 18px;
      font-weight: bold;
      color: #1b4332;
    }
    .preview-role {
      font-size: 12px;
      color: #40916c;
      font-weight: 600;
    }

    /* صفحة الملف الشخصي (Modal) */
    .profile-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .profile-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .profile-card {
      background: #f4fbf7;
      color: #1b4332;
      border: 3px solid #52b788;
      border-radius: 30px;
      width: 100%;
      max-width: 380px;
      padding: 25px;
      text-align: center;
      position: relative;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .profile-modal.active .profile-card {
      transform: scale(1);
    }

    /* صورة الملف الشخصي */
    .profile-img-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 12px auto;
      position: relative;
    }
    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #2d6a4f;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }
    .leader-badge {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d6a4f;
      color: #d8f3dc;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid #74c69d;
      white-space: nowrap;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 900;
      margin: 5px 0 2px 0;
      color: #081c15;
    }

    /* شبكة تفاصيل الملف */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
      text-align: right;
    }
    .detail-box {
      background: #e8f5e9;
      border: 1px solid #b7e4c7;
      padding: 10px 12px;
      border-radius: 14px;
    }
    .detail-label {
      font-size: 11px;
      color: #40916c;
      font-weight: bold;
      display: block;
      margin-bottom: 2px;
    }
    .detail-value {
      font-size: 14px;
      font-weight: 800;
      color: #1b4332;
    }

    /* قسم الأشياء التي لا تحبها */
    .dislikes-box {
      background: #ffebee;
      border: 1px solid #ffcdd2;
      border-radius: 16px;
      padding: 12px 14px;
      text-align: right;
      margin-bottom: 18px;
    }
    .dislikes-title {
      color: #c62828;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .dislikes-text {
      color: #b71c1c;
      font-size: 13px;
      margin: 0;
      line-height: 1.4;
      font-weight: 600;
    }

    /* زر العودة */
    .close-btn {
      background: #1b4332;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .close-btn:hover { background: #2d6a4f; }
  </style>
</head>
<body>

  <!-- زوايا الغابة -->
  <div class="forest-corner top-left">🌲</div>
  <div class="forest-corner top-right">🌳</div>

  <div class="main-container">
    <!-- هيدر الكلان -->
    <div class="clan-header">
      <h1 class="clan-title">🍃 𝑪𝑶𝑶𝑳 𝑴𝑰𝑵𝑻 🍵</h1>
      <div class="clan-subtitle">كلان النعناع الرسمي | Mint Clan Hub</div>
    </div>

    <!-- الزر الرئيسي -->
    <button class="explore-btn" onclick="toggleMembers()">
      🔍 اضغط للتعرف على أعضاء كلان النعناع
    </button>

    <!-- قائمة الأعضاء -->
    <div class="members-grid" id="membersGrid">
      
      <!-- بطاقة صفاء -->
      <div class="member-card-preview" onclick="openProfile('safaa')">
        <div class="preview-info">
          <img src="character.jpg" alt="صفاء" class="preview-avatar">
          <div style="text-align: right;">
            <div class="preview-name">صفاء</div>
            <div class="preview-role">👑 قائدة الكلان (Leader)</div>
          </div>
        </div>
        <span style="color: #2d6a4f; font-weight: bold; font-size: 18px;">←</span>
      </div>

    </div>
  </div>

  <!-- نافذة الملف الشخصي الكاملة -->
  <div class="profile-modal" id="profileModal">
    <div class="profile-card">
      <div class="profile-img-container">
        <img src="character.jpg" alt="صفاء" class="profile-img" id="mImg">
        <div class="leader-badge" id="mBadge">👑 Leader</div>
      </div>

      <h2 class="profile-name" id="mName">صفاء</h2>
      <p style="font-size: 12px; color: #40916c; margin: 0 0 10px 0; font-weight: 600;" id="mTitle">مؤسسة كلان النعناع 🌿</p>

      <!-- شبكة البيانات -->
      <div class="details-grid">
        <div class="detail-box">
          <span class="detail-label">البلد</span>
          <span class="detail-value" id="mCountry">🇲🇦 المغرب</span>
        </div>
        <div class="detail-box">
          <span class="detail-label">النمط</span>
          <span class="detail-value" id="mMbti">INFP-T</span>
        </div>
        <div class="detail-box">
          <span class="detail-label">الرتبة في الكلان</span>
          <span class="detail-value" id="mRole">قائدة الكلان</span>
        </div>
        <div class="detail-box">
          <span class="detail-label">الحالة</span>
          <span class="detail-value" style="color: #2d6a4f;">نشطة 🟢</span>
        </div>
      </div>

      <!-- الأشياء التي لا تحبها -->
      <div class="dislikes-box">
        <div class="dislikes-title">🚫 أشياء تكرهها في الشخصية:</div>
        <p class="dislikes-text" id="mDislikes">النفاق، التصنع، والتجاهل.</p>
      </div>

      <!-- زر العودة -->
      <button class="close-btn" onclick="closeProfile()">إغلاق الملف</button>
    </div>
  </div>

  <script>
    const clickAudio = new Audio('click.mp3');

    function playSound() {
      clickAudio.currentTime = 0;
      clickAudio.play().catch(e => console.log(e));
    }

    // إظهار/إخفاء قائمة الأعضاء
    function toggleMembers() {
      playSound();
      const grid = document.getElementById('membersGrid');
      grid.classList.toggle('show');
    }

    // بيانات الأعضاء (يمكنك إضافة أي عضو جديد هنا مستقبلاً)
    const membersData = {
      safaa: {
        name: 'صفاء',
        title: 'مؤسسة وقائدة كلان النعناع 🌿',
        country: '🇲🇦 المغرب',
        mbti: 'INFP-T',
        role: 'قائدة الكلان (Leader)',
        badge: '👑 Leader',
        dislikes: 'النفاق، التصنع، وقلة الاحترام.',
        image: 'character.jpg'
      }
    };

    // فتح الملف الشخصي
    function openProfile(memberId) {
      playSound();
      const data = membersData[memberId];
      if (!data) return;

      document.getElementById('mName').innerText = data.name;
      document.getElementById('mTitle').innerText = data.title;
      document.getElementById('mCountry').innerText = data.country;
      document.getElementById('mMbti').innerText = data.mbti;
      document.getElementById('mRole').innerText = data.role;
      document.getElementById('mBadge').innerText = data.badge;
      document.getElementById('mDislikes').innerText = data.dislikes;
      document.getElementById('mImg').src = data.image;

      document.getElementById('profileModal').classList.add('active');
    }

    // إغلاق الملف الشخصي
    function closeProfile() {
      playSound();
      document.getElementById('profileModal').classList.remove('active');
    }
  </script>
</body>
</html>
