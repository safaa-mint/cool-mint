<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COOL MINT | كلان النعناع 🌿</title>
  <style>
    /* الإعدادات العامة والخلفية */
    * { box-sizing: border-box; }
    body {
      background: #0f2310;
      background-image: radial-gradient(circle at 50% 30%, #1e4620 0%, #0f2310 85%);
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      color: #e8f5e9;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* زوايا الغابة */
    .forest-corner {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0.25;
      font-size: 80px;
      user-select: none;
    }
    .top-left { top: -20px; left: -10px; }
    .top-right { top: -20px; right: -10px; }

    /* الحاوية الرئيسية - عريضة للتصميم الأفقّي */
    .main-container {
      width: 100%;
      max-width: 960px;
      z-index: 10;
      text-align: center;
    }

    /* شريط العنوان والأزرار أفقياً */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    /* الهيدر والعنوان */
    .clan-header {
      background: rgba(27, 67, 50, 0.85);
      border: 2px solid #52b788;
      border-radius: 25px;
      padding: 15px 30px;
      backdrop-filter: blur(5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      flex: 1;
      min-width: 280px;
      text-align: right;
    }
    .clan-title {
      font-size: 28px;
      font-weight: 900;
      margin: 0;
      color: #d8f3dc;
      letter-spacing: 1px;
    }
    .clan-subtitle {
      font-size: 14px;
      color: #95d5b2;
      margin-top: 2px;
      font-weight: 600;
    }

    /* أزرار التحكم الفوقية */
    .controls-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: flex-end;
    }

    .action-btn {
      background: linear-gradient(180deg, #52b788 0%, #2d6a4f 100%);
      color: white;
      border: 2px solid #74c69d;
      padding: 12px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(45, 106, 79, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }
    .action-btn:hover { transform: translateY(-2px); }
    .action-btn.video-btn {
      background: linear-gradient(180deg, #d8f3dc 0%, #74c69d 100%);
      color: #081c15;
      border-color: #b7e4c7;
    }

    /* قائمة الأعضاء شبكة أفقية */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .members-grid.show {
      opacity: 1;
      max-height: 2000px;
      margin-top: 15px;
    }

    /* كارت العضو بقائمة الاختيار */
    .member-card-preview {
      background: rgba(232, 245, 233, 0.95);
      border: 2px solid #74c69d;
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .member-card-preview:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .preview-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .preview-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2d6a4f;
    }
    .preview-name {
      font-size: 16px;
      font-weight: bold;
      color: #1b4332;
    }
    .preview-role {
      font-size: 12px;
      color: #40916c;
      font-weight: 600;
    }

    /* النوافذ المنبثقة (Modals) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* نافذة الكارت أفقية وعريضة */
    .modal-card {
      background: #f4fbf7;
      color: #1b4332;
      border: 3px solid #52b788;
      border-radius: 30px;
      width: 100%;
      max-width: 760px;
      position: relative;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    /* البانر العلوي */
    .profile-banner-container {
      width: 100%;
      height: 110px;
      background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
      position: relative;
      overflow: hidden;
    }
    .profile-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* محتوى الكارت الموزّع أفقياً */
    .modal-body-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 20px;
      padding: 0 22px 22px 22px;
      text-align: right;
    }
    @media (max-width: 650px) {
      .modal-body-layout { grid-template-columns: 1fr; }
    }

    /* العمود الأيمن من البروفايل */
    .profile-left-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .profile-img-container {
      width: 95px;
      height: 95px;
      margin: -45px auto 10px auto;
      position: relative;
      z-index: 2;
    }
    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #f4fbf7;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
      background: #2d6a4f;
    }
    .leader-badge {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d6a4f;
      color: #d8f3dc;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #74c69d;
      white-space: nowrap;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 900;
      margin: 5px 0 2px 0;
      color: #081c15;
    }

    /* العمود الأيسر للتفاصيل */
    .profile-right-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 15px;
    }

    /* شبكة تفاصيل الملف */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .detail-box {
      background: #e8f5e9;
      border: 1px solid #b7e4c7;
      padding: 8px 10px;
      border-radius: 12px;
    }
    .detail-label {
      font-size: 10px;
      color: #40916c;
      font-weight: bold;
      display: block;
      margin-bottom: 2px;
    }
    .detail-value {
      font-size: 12px;
      font-weight: 800;
      color: #1b4332;
    }

    /* قسم الأشياء التي لا تحبها */
    .dislikes-box {
      background: #ffebee;
      border: 1px solid #ffcdd2;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .dislikes-title {
      color: #c62828;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .dislikes-text {
      color: #b71c1c;
      font-size: 12px;
      margin: 0;
      line-height: 1.4;
      font-weight: 600;
    }

    /* مشغل أغنية ريتا (الأسطوانة) */
    .rita-player-box {
      background: transparent;
      padding: 5px 0;
      text-align: center;
      display: none;
      width: 100%;
    }
    .vinyl-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 5px auto;
      cursor: pointer;
    }
    .vinyl-record {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
    }
    .vinyl-container:hover .vinyl-record {
      transform: scale(1.05);
    }

    .song-title-text {
      font-size: 13px;
      font-weight: 800;
      color: #1b4332;
      margin-top: 2px;
    }

    /* النغمات الموسيقية المتحركة */
    .music-note {
      position: absolute;
      font-size: 20px;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }
    .vinyl-container.playing .vinyl-record {
      animation: spinVinyl 3s linear infinite;
    }
    .vinyl-container.playing .note-1 { animation: floatNote1 1.8s infinite ease-out; }
    .vinyl-container.playing .note-2 { animation: floatNote2 2.1s infinite ease-out 0.4s; }
    .vinyl-container.playing .note-3 { animation: floatNote3 1.9s infinite ease-out 0.8s; }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatNote1 {
      0% { top: 30%; left: 45%; opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; }
      100% { top: -30px; left: 15%; opacity: 0; transform: scale(1.2) rotate(-20deg); }
    }
    @keyframes floatNote2 {
      0% { top: 30%; left: 45%; opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; }
      100% { top: -40px; left: 75%; opacity: 0; transform: scale(1.3) rotate(20deg); }
    }
    @keyframes floatNote3 {
      0% { top: 30%; left: 45%; opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; }
      100% { top: -45px; left: 45%; opacity: 0; transform: scale(1.4); }
    }

    /* مشغل الراب الخاص بصفاء */
    .rap-player-box {
      background: linear-gradient(135deg, #1b4332 0%, #081c15 100%);
      border: 2px solid #52b788;
      border-radius: 16px;
      padding: 10px 12px;
      color: white;
      text-align: center;
      display: none;
      width: 100%;
      margin-top: 5px;
    }
    .rap-title {
      font-size: 12px;
      font-weight: 800;
      color: #74c69d;
      margin-bottom: 6px;
      display: block;
    }
    .rap-btn {
      background: #52b788;
      color: #081c15;
      border: none;
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }
    .rap-btn:hover { background: #74c69d; }

    /* مشغل الفيديو */
    .clan-video-player {
      width: 100%;
      border-radius: 18px;
      border: 2px solid #52b788;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      outline: none;
      margin-top: 10px;
    }

    /* زر الإغلاق */
    .close-btn {
      background: #1b4332;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .close-btn:hover { background: #2d6a4f; }
  </style>
</head>

  <script>
    function playClickSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch(e) {}
    }

    function renderMembersList() {
      const grid = document.getElementById('membersGrid');
      grid.innerHTML = '';
      for (let id in membersData) {
        const m = membersData[id];
        grid.innerHTML += `
          <div class="member-card-preview" onclick="openProfile('${id}')">
            <div class="preview-info">
              <img src="${m.image}" alt="${m.name}" class="preview-avatar" onerror="this.src='character.jpg'">
              <div style="text-align: right;">
                <div class="preview-name">${m.name}</div>
                <div class="preview-role">${m.badge}</div>
              </div>
            </div>
            <span style="color: #2d6a4f; font-weight: bold; font-size: 18px;">←</span>
          </div>
        `;
      }
    }
    renderMembersList();

    function toggleRitaSong() {
      playClickSound();
      const container = document.getElementById('vinylContainer');

      if (!isRitaPlaying) {
        ritaAudio.play().then(() => {
          isRitaPlaying = true;
          container.classList.add('playing');
        }).catch(err => {
          isRitaPlaying = true;
          container.classList.add('playing');
        });
      } else {
        stopRitaSong();
      }
    }

    function stopRitaSong() {
      ritaAudio.pause();
      ritaAudio.currentTime = 0;
      isRitaPlaying = false;
      const container = document.getElementById('vinylContainer');
      if (container) container.classList.remove('playing');
    }

    ritaAudio.onended = function() { stopRitaSong(); };

    function toggleRap() {
      playClickSound();
      const btn = document.getElementById('rapBtn');
      if (!isRapPlaying) {
        rapAudio.play().then(() => {
          isRapPlaying = true;
          btn.innerHTML = '⏸️ إيقاف المقطع';
          btn.style.background = '#e63946';
          btn.style.color = 'white';
        }).catch(err => {
          alert('يرجى التأكد من رفع ملف الصوت باسم safaa-rap.mp3');
        });
      } else {
        stopRap();
      }
    }

    function stopRap() {
      rapAudio.pause();
      rapAudio.currentTime = 0;
      isRapPlaying = false;
      const btn = document.getElementById('rapBtn');
      if (btn) {
        btn.innerHTML = '▶️ اسمعي بارات القائدة';
        btn.style.background = '#52b788';
        btn.style.color = '#081c15';
      }
    }

    rapAudio.onended = function() { stopRap(); };

    function openProfile(memberId) {
      playClickSound();
      const data = membersData[memberId];
      if (!data) return;

      document.getElementById('mName').innerText = data.name;
      document.getElementById('mTitle').innerText = data.title;
      document.getElementById('mCountry').innerText = data.country;
      document.getElementById('mMbti').innerText = data.mbti;
      document.getElementById('mRole').innerText = data.role;
      document.getElementById('mHobby').innerText = data.hobby;
      document.getElementById('mBadge').innerText = data.badge;
      document.getElementById('mDislikes').innerText = data.dislikes;
      
      const imgElem = document.getElementById('mImg');
      imgElem.src = data.image;
      imgElem.onerror = function() { this.src = 'character.jpg'; };

      const bannerImg = document.getElementById('mBanner');
      if (data.banner && data.banner.trim() !== '') {
        bannerImg.src = data.banner;
        bannerImg.style.display = 'block';
      } else {
        bannerImg.style.display = 'none';
      }

      const rapBox = document.getElementById('rapPlayerBox');
      rapBox.style.display = data.hasRap ? 'block' : 'none';

      const ritaBox = document.getElementById('ritaPlayerBox');
      ritaBox.style.display = data.hasRitaSong ? 'block' : 'none';

      document.getElementById('profileModal').classList.add('active');
    }

    function closeProfile() {
      playClickSound();
      stopRap();
      stopRitaSong();
      document.getElementById('profileModal').classList.remove('active');
    }
  </script>
</body>
</html>
